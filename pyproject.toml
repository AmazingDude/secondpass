[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secondpass"
version = "0.1.0"
description = "Personal security + architecture review agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "openai",
    "pydantic>=2",
    "pytest",
    "python-dotenv",
    "rich",
    "semgrep",
    "tavily-python",
    "typer",
    "uvicorn>=0.30",
]

[project.scripts]
secondpass = "app.cli:run"

[tool.setuptools.packages.find]
include = ["app*"]
