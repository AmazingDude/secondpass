[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secondpass"
version = "0.1.0"
description = "Personal security + architecture review agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "filelock>=3.32,<4",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "openai",
    "pydantic>=2",
    "platformdirs>=4.9,<5",
    "python-dotenv",
    "rich",
    "semgrep",
    "tavily-python",
    "typer",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
memory = ["chromadb"]
dev = ["pytest>=8", "setuptools>=61", "packaging>=24"]

[project.scripts]
secondpass = "app.cli:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["security_lessons.json", "static_rules.yml"]
